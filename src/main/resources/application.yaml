spring:
  application:
    name: FoxSkinServer
  # 从项目根目录的 .env 加载环境变量（按 properties 格式解析；文件缺失时不报错）。
  # .env 不提交到 git；真实 OS/Docker 环境变量优先级高于 .env（12-factor）。
  config:
    import: "optional:file:.env[.properties]"
  servlet:
    multipart:
      max-file-size: "${FILE_MAX_FILE_SIZE:100MB}"
      max-request-size: "${FILE_MAX_REQUEST_SIZE:500MB}"
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/shopmall}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:postgres}"
  jpa:
    hibernate:
      # update=开发自动建表 / validate=生产校验 / none
      ddl-auto: "${DB_DDL:update}"
    open-in-view: false
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"
      database: 7

server:
  port: "${SERVER_PORT:1562}"

# 管理端通过应用内的 Actuator 端点对象汇总运行指标；Web 侧只开放无敏感明细的探活与版本入口。
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: never
      show-components: never

shopmall:
  security:
    default-admin:
      # 启用后在应用启动时创建默认管理员；同邮箱已存在时不会修改其密码或权限。
      enabled: "${DEFAULT_ADMIN_ENABLED:false}"
      email: "${DEFAULT_ADMIN_EMAIL:}"
      username: "${DEFAULT_ADMIN_USERNAME:}"
      fixed-token:
        # 仅供本地开发使用。配置值即 Authorization: Bearer 后的完整令牌。
        enabled: "${DEFAULT_ADMIN_FIXED_TOKEN_ENABLED:false}"
        token: "${DEFAULT_ADMIN_FIXED_TOKEN:}"
      password: "${DEFAULT_ADMIN_PASSWORD:}"
    jwt:
      # 生产环境务必通过 .env 覆盖为足够长的随机串。
      secret: "${JWT_SECRET:dev-secret-do-not-use-in-prod-please-override-via-JWT_SECRET}"
      access:
        ttl-seconds: "${JWT_ACCESS_TTL_SECONDS:1800}"
      refresh:
        ttl-seconds: "${JWT_REFRESH_TTL_SECONDS:604800}"
        rotate: "${JWT_REFRESH_ROTATE:true}"
        reuse-detect: "${JWT_REFRESH_REUSE_DETECT:true}"
        grace-seconds: "${JWT_REFRESH_GRACE_SECONDS:30}"
        cookie:
          name: "${JWT_REFRESH_COOKIE_NAME:refresh_token}"
          domain: "${JWT_REFRESH_COOKIE_DOMAIN:}"
          path: "${JWT_REFRESH_COOKIE_PATH:/api/auth}"
          secure: "${JWT_REFRESH_COOKIE_SECURE:true}"
          http-only: "${JWT_REFRESH_COOKIE_HTTP_ONLY:true}"
          same-site: "${JWT_REFRESH_COOKIE_SAME_SITE:Lax}"
  yggdrasil:
    api-path: "${YGGDRASIL_API_PATH:/api/yggdrasil}"
    server-name: "${YGGDRASIL_SERVER_NAME:FoxSkinServer}"
    implementation-name: "${YGGDRASIL_IMPLEMENTATION_NAME:FoxSkinServer}"
    implementation-version: "${YGGDRASIL_IMPLEMENTATION_VERSION:0.0.1}"
    require-verified: "${YGGDRASIL_REQUIRE_VERIFIED:false}"
    skin-domains: "${YGGDRASIL_SKIN_DOMAINS:localhost}"
    texture-base-url: "${YGGDRASIL_TEXTURE_BASE_URL:}"
    # 生产必须注入至少 4096 位 RSA PEM 私钥，开发环境留空会生成临时 4096 位密钥。
    private-key-pem: "${YGGDRASIL_PRIVATE_KEY_PEM:}"
    token-expire-seconds: "${YGGDRASIL_TOKEN_EXPIRE_SECONDS:259200}"
    refresh-expire-seconds: "${YGGDRASIL_REFRESH_EXPIRE_SECONDS:604800}"
    join-expire-seconds: "${YGGDRASIL_JOIN_EXPIRE_SECONDS:120}"
    profile-search-max: "${YGGDRASIL_PROFILE_SEARCH_MAX:5}"
    throttle-interval-millis: "${YGGDRASIL_THROTTLE_INTERVAL_MILLIS:1000}"
  mojang:
    enabled: "${MOJANG_AUTH_ENABLED:false}"
    runtime-toggle: "${MOJANG_RUNTIME_TOGGLE:true}"
    cache-seconds: "${MOJANG_CACHE_SECONDS:30}"
    profile-url: "${MOJANG_PROFILE_URL:https://api.minecraftservices.com/minecraft/profile}"
    entitlement-url: "${MOJANG_ENTITLEMENT_URL:https://api.minecraftservices.com/entitlements/mcstore}"
    connect-timeout-millis: "${MOJANG_CONNECT_TIMEOUT_MILLIS:2000}"
    read-timeout-millis: "${MOJANG_READ_TIMEOUT_MILLIS:3000}"

foxskin:
  oauth:
    # 配置了凭据即启用对应提供商，全部留空时组件保持静默。
    public-url: "${FOXSKIN_OAUTH_PUBLIC_URL:}"
    frontend-url: "${FOXSKIN_OAUTH_FRONTEND_URL:}"
    state-ttl-seconds: "${FOXSKIN_OAUTH_STATE_TTL_SECONDS:300}"
    qq:
      client-id: "${FOXSKIN_OAUTH_QQ_CLIENT_ID:}"
      client-secret: "${FOXSKIN_OAUTH_QQ_CLIENT_SECRET:}"
      scope: "${FOXSKIN_OAUTH_QQ_SCOPE:get_user_info}"
      display-name: "${FOXSKIN_OAUTH_QQ_DISPLAY_NAME:QQ}"
    oidc:
      issuer: "${FOXSKIN_OAUTH_OIDC_ISSUER:}"
      client-id: "${FOXSKIN_OAUTH_OIDC_CLIENT_ID:}"
      client-secret: "${FOXSKIN_OAUTH_OIDC_CLIENT_SECRET:}"
      scope: "${FOXSKIN_OAUTH_OIDC_SCOPE:openid profile email}"
      display-name: "${FOXSKIN_OAUTH_OIDC_DISPLAY_NAME:OIDC}"
    microsoft:
      client-id: "${FOXSKIN_OAUTH_MICROSOFT_CLIENT_ID:}"
      client-secret: "${FOXSKIN_OAUTH_MICROSOFT_CLIENT_SECRET:}"
      scope: "${FOXSKIN_OAUTH_MICROSOFT_SCOPE:XboxLive.signin offline_access}"
      display-name: "${FOXSKIN_OAUTH_MICROSOFT_DISPLAY_NAME:Microsoft}"

file:
  storage-path: "${FILE_STORAGE_PATH:./storage}"
  base-url: "${FILE_BASE_URL:http://localhost:8080}"
  signing-secret: "${FILE_SIGNING_SECRET:dev-file-signing-secret-do-not-use-in-prod}"
  download-token-ttl-seconds: "${FILE_DOWNLOAD_LINK_TTL_SECONDS:300}"
  max-batch-size: "${FILE_MAX_BATCH_SIZE:20}"
  max-file-size-bytes: "${FILE_MAX_FILE_SIZE_BYTES:104857600}"
  signing:
    public-ttl-seconds: "${FILE_SIGN_PUBLIC_TTL:60}"
    user-ttl-seconds: "${FILE_SIGN_USER_TTL:300}"
    admin-ttl-seconds: "${FILE_SIGN_ADMIN_TTL:180}"
    order-ttl-seconds: "${FILE_SIGN_ORDER_TTL:300}"
